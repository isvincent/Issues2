<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 賦能議題教育 · 互動探索</title>
<style>
  :root{
    --bg:#f4f5f8; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --c1:#c0392b; --c1l:#fbeae8;
    --c2:#1e8449; --c2l:#e6f4ea;
    --c3:#1f6fb2; --c3l:#e6f0f9;
    --c4:#7d3c98; --c4l:#f0e6f5;
    --shadow:0 6px 24px rgba(20,24,40,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* hero */
  header.hero{
    background:linear-gradient(135deg,#1a1a2e 0%,#2d2d54 55%,#3a3a6a 100%);
    color:#fff;padding:64px 0 52px;position:relative;overflow:hidden;
  }
  header.hero::after{
    content:"";position:absolute;right:-80px;top:-80px;width:340px;height:340px;
    background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);border-radius:50%;
  }
  .hero h1{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:1px}
  .hero .sub{font-size:clamp(15px,2.4vw,20px);opacity:.92;margin-top:10px}
  .hero .en{font-size:17px;opacity:.6;font-style:italic;margin-top:6px;letter-spacing:.5px}
  .hero .intro{max-width:760px;margin-top:22px;font-size:19px;opacity:.88;line-height:1.85}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
  .stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
    border-radius:14px;padding:12px 18px;backdrop-filter:blur(6px)}
  .stat b{font-size:24px;display:block;font-weight:800}
  .stat span{font-size:16px;opacity:.8}

  /* controls */
  .controls{position:sticky;top:0;z-index:40;background:rgba(244,245,248,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid #e4e6ec;padding:14px 0}
  .controls .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid #dfe2ea;border-radius:12px;padding:10px 14px}
  .search input{border:0;outline:0;font:inherit;width:100%;background:transparent;color:var(--ink)}
  .search svg{flex:none;opacity:.5}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid #d6d9e2;background:#fff;color:var(--muted);
    border-radius:999px;padding:8px 16px;font-size:18px;font-weight:600;cursor:pointer;
    transition:.18s;white-space:nowrap}
  .chip:hover{transform:translateY(-1px)}
  .chip.active{color:#fff;border-color:transparent}
  .chip[data-c="all"].active{background:#1a1a2e}
  .chip[data-c="0"].active{background:var(--c1)}
  .chip[data-c="1"].active{background:var(--c2)}
  .chip[data-c="2"].active{background:var(--c3)}
  .chip[data-c="3"].active{background:var(--c4)}

  /* sections */
  main{padding:36px 0 60px}
  .cat{margin-bottom:42px}
  .cat-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;
    padding:16px 22px;border-radius:var(--radius);color:#fff;box-shadow:var(--shadow)}
  .cat-head .icon{font-size:30px}
  .cat-head h2{font-size:clamp(20px,3vw,26px);font-weight:800}
  .cat-head .cen{font-size:16px;opacity:.85;font-style:italic}
  .cat-head .count{margin-left:auto;background:rgba(255,255,255,.2);
    border-radius:999px;padding:5px 14px;font-size:17px;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}

  .topic{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;border:1px solid #edeef3;transition:.2s;display:flex;flex-direction:column}
  .topic:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(20,24,40,.13)}
  .topic .t-head{padding:18px 20px 14px;cursor:pointer;position:relative}
  .topic .t-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
  .topic .t-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
  .topic .t-role{font-size:17.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .topic .t-role b{color:var(--ink);font-weight:700}
  .toggle{position:absolute;right:18px;top:18px;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
    color:#fff;transition:.25s}
  .topic.open .toggle{transform:rotate(45deg)}

  .examples{max-height:0;overflow:hidden;transition:max-height .4s ease;padding:0 20px}
  .topic.open .examples{max-height:760px;padding-bottom:18px}
  .ex{display:flex;gap:12px;padding:12px 0;border-top:1px dashed #e6e8ef;align-items:flex-start}
  .ex:first-child{border-top:1px solid #eef0f5;margin-top:4px}
  .ex .num{flex:none;width:34px;height:34px;border-radius:10px;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:800;line-height:1}
  .ex .num small{font-size:12px;font-weight:600;opacity:.9}
  .ex .num span{font-size:19px}
  .ex p{font-size:18.5px;color:#33384a}
  .ex p strong{font-weight:800}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty b{display:block;font-size:18px;margin-bottom:6px;color:var(--ink)}

  footer{text-align:center;padding:30px 20px 50px;color:var(--muted);font-size:17px}
  mark{background:#ffe680;color:inherit;border-radius:3px;padding:0 2px}

  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .hero{padding:46px 0 38px}
  }
</style>
</head>

</div>

const app = document.getElementById("app");
let activeCat = "all";
let query = "";

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hl(s){
  if(!query) return esc(s);
  const re = new RegExp("("+query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return esc(s).replace(re,"<mark>$1</mark>");
}

function render(){
  app.innerHTML = "";
  let totalShown = 0;

  DATA.forEach((cat,ci)=>{
    if(activeCat!=="all" && String(ci)!==activeCat) return;

    const topics = cat.topics.filter(t=>{
      if(!query) return true;
      const blob = (t.name+t.role+t.examples.join("")).toLowerCase();
      return blob.includes(query.toLowerCase());
    });
    if(topics.length===0) return;
    totalShown += topics.length;

    const sec = document.createElement("section");
    sec.className = "cat";
    sec.innerHTML = `
      <div class="cat-head" style="background:${cat.color}">
        <span class="icon">${cat.icon}</span>
        <div>
          <h2>${cat.cat}</h2>
          <div class="cen">${cat.catEn}</div>
        </div>
        <span class="count">${topics.length} 議題</span>
      </div>
      <div class="grid"></div>`;
    const grid = sec.querySelector(".grid");

    topics.forEach(t=>{
      const card = document.createElement("div");
      card.className = "topic";
      const exHTML = t.examples.map((ex,i)=>`
        <div class="ex">
          <div class="num" style="background:${cat.color}"><small>實例</small><span>${i+1}</span></div>
          <p>${hl(ex)}</p>
        </div>`).join("");
      card.innerHTML = `
        <div class="t-head">
          <span class="toggle" style="background:${cat.color}">+</span>
          <div class="t-name" style="border-color:${cat.color}">${hl(t.name)}</div>
          <div class="t-role"><b>AI 角色：</b>${hl(t.role)}</div>
        </div>
        <div class="examples">${exHTML}</div>`;
      card.querySelector(".t-head").style.borderLeft="6px solid "+cat.color;
      card.querySelector(".t-head").addEventListener("click",()=>card.classList.toggle("open"));
      // auto-open when searching
      if(query) card.classList.add("open");
      grid.appendChild(card);
    });
    app.appendChild(sec);
  });

  if(totalShown===0){
    app.innerHTML = `<div class="empty"><b>找不到符合的議題或實例</b>試試其他關鍵字，或點選「全部」。</div>`;
  }
}

document.getElementById("filters").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  b.classList.add("active");
  activeCat = b.dataset.c;
  render();
});
document.getElementById("q").addEventListener("input",e=>{
  query = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
